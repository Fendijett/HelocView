<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HelocView</title>

  <!-- Bulma CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css"
  />

  <!-- Custom tweaks -->
  <style>
    html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;  /* no window-level scrollbars */
  height: 100%;
}

.section {
  height: 100%;
  overflow-y: auto;  /* if the form ever grows, it will scroll only inside the section */
}

    body {
      background-color: #f5f7fa;
      padding-top: 40px;
    }
    .box {
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-radius: 8px;
    }
    #results {
      margin-top: 24px;
    }
    #title-bar {
  -webkit-app-region: drag;
  display: flex; align-items: center;
  height: 32px; background: #2f3640; color: #fff;
}
#win-icon {
  -webkit-app-region: no-drag;
  width:16px; height:16px; margin:0 8px;
}
#win-title { flex:1; user-select:none; }
#win-controls button {
  -webkit-app-region: no-drag;
  background:transparent; border:none;
  color:#fff; width:46px; cursor:pointer;
}
#win-controls button:hover { background:rgba(255,255,255,0.2); }

  </style>
</head>
<body>
  <div id="title-bar">
    <img src="assets/app-icon.png" id="win-icon" />
    <span id="win-title">HelocView</span>
    <div id="win-controls">
      <button id="min-btn">—</button>
      <button id="max-btn">☐</button>
      <button id="close-btn">✕</button>
    </div>
  </div>
  <section class="section">
    <div class="container" style="max-width: 480px;">
      <h1 class="title has-text-centered">HelocView</h1>

      <div class="box">
        <!-- Home Equity -->
        <div class="field">
          <label class="label">Home Equity ($)</label>
          <div class="control">
            <input
              id="equity"
              class="input"
              type="number"
              placeholder="e.g. 350000"
            />
          </div>
        </div>

        <!-- Purchase + Rehab -->
        <div class="field">
          <label class="label">Purchase Price ($)</label>
          <div class="control">
            <input
              id="price"
              class="input"
              type="number"
              placeholder="e.g. 50000"
            />
          </div>
        </div>
        <div class="field">
          <label class="label">Rehab Cost ($)</label>
          <div class="control">
            <input
              id="rehab"
              class="input"
              type="number"
              placeholder="e.g. 15000"
            />
          </div>
        </div>

        <!-- HELOC Details -->
        <div class="field">
          <label class="label">HELOC Amount ($)</label>
          <div class="control">
            <input
              id="heloc"
              class="input"
              type="number"
              placeholder="e.g. 65000"
            />
          </div>
        </div>
        <div class="field is-grouped">
          <div class="control is-expanded">
            <label class="label">Interest Rate (%)</label>
            <input
              id="rate"
              class="input"
              type="number"
              step="0.01"
              placeholder="e.g. 6.5"
            />
          </div>
          <div class="control is-expanded">
            <label class="label">Term (years)</label>
            <input
              id="years"
              class="input"
              type="number"
              placeholder="e.g. 15"
            />
          </div>
        </div>

        <!-- Rent -->
        <div class="field">
          <label class="label">Monthly Rent ($)</label>
          <div class="control">
            <input
              id="rent"
              class="input"
              type="number"
              placeholder="e.g. 1000"
            />
          </div>
        </div>

        <!-- Button -->
        <div class="field">
          <div class="control">
            <button
              class="button is-primary is-fullwidth"
              onclick="calculateDeal()"
            >
              Calculate Deal
            </button>
          </div>
        </div>
      </div>

      <!-- Results -->
      <div id="results"></div>
    </div>
  </section>
  <script>
    // at the bottom of index.html, before </body>
    const { getCurrentWindow } = require('@electron/remote');
    const win = getCurrentWindow();
  
    document.getElementById('min-btn').onclick = () => win.minimize();
    document.getElementById('max-btn').onclick = () =>
      win.isMaximized() ? win.unmaximize() : win.maximize();
    document.getElementById('close-btn').onclick = () => win.close();
  
    // your existing calculateDeal() function goes above this
  </script>
  
  <script>
    const { remote } = require('electron');
    const win = remote.getCurrentWindow();
    document.getElementById('min-btn').onclick = () => win.minimize();
    document.getElementById('max-btn').onclick = () =>
      win.isMaximized() ? win.unmaximize() : win.maximize();
    document.getElementById('close-btn').onclick = () => win.close();
  </script>
  

  <script>
    function calculateDeal() {
      const eq    = parseFloat(document.getElementById('equity').value);
      const price = parseFloat(document.getElementById('price').value);
      const rehab = parseFloat(document.getElementById('rehab').value);
      const h     = parseFloat(document.getElementById('heloc').value);
      const rate  = parseFloat(document.getElementById('rate').value) / 100 / 12;
      const years = parseInt(document.getElementById('years').value, 10);
      const rent  = parseFloat(document.getElementById('rent').value);
      const n     = years * 12;

      if ([eq, price, rehab, h, rate, years, rent].some(v => isNaN(v)) || years <= 0) {
        return alert('⚠️ Please fill in _all_ fields with valid numbers.');
      }

      const payment = h * rate * Math.pow(1 + rate, n) / (Math.pow(1 + rate, n) - 1);
      const cashFlow = rent - payment;
      const annualCF = cashFlow * 12;
      const roi = h > 0 ? (annualCF / h * 100) : 0;
      const eqRemaining = eq - h;
      const totalCost = price + rehab;
      const warning = h < totalCost
        ? `<p class="has-text-danger">⚠️ HELOC ($${h.toLocaleString()}) is less than total cost ($${totalCost.toLocaleString()}).</p>`
        : '';

      document.getElementById('results').innerHTML = `
        <div class="notification is-light">
          <p><strong>HELOC Payment:</strong> $${payment.toFixed(2)}/mo</p>
          <p><strong>Cash Flow:</strong> $${cashFlow.toFixed(2)}/mo</p>
          <p><strong>Annual ROI:</strong> ${roi.toFixed(1)}%</p>
          <p><strong>Equity Remaining:</strong> $${eqRemaining.toLocaleString()}</p>
          ${warning}
        </div>
      `;
    }
  </script>
</body>
</html>
